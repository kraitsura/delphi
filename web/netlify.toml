[build]
  command = "npm run build"
  publish = ".netlify/functions-internal"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"
  # Increase function timeout for AI operations
  included_files = ["dist/**", "public/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/render"
  status = 200

# Environment variables (set these in Netlify UI or via CLI)
# Required environment variables:
# - CONVEX_DEPLOYMENT
# - VITE_CONVEX_URL
# - VITE_CONVEX_SITE_URL
# - VITE_WORKER_URL
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
