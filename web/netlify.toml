[build]
  command = "bun install && bun run build"
  publish = "dist/client"

# Use Bun runtime
[build.environment]
  BUN_VERSION = "1.1.38"

# Environment variables (set these in Netlify UI or via CLI)
# Required environment variables:
# - CONVEX_DEPLOYMENT
# - VITE_CONVEX_URL
# - VITE_CONVEX_SITE_URL
# - VITE_WORKER_URL
# - VITE_SITE_URL
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - VITE_AGENT_WORKER_SECRET
