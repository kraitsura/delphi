[build]
  command = "bun install && bun run build"
  publish = "dist/client"

[functions]
  node_bundler = "esbuild"
  directory = ".netlify/v1/functions"

# Use Bun runtime
[build.environment]
  BUN_VERSION = "1.1.38"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

# Environment variables (set these in Netlify UI or via CLI)
# Required environment variables:
# - CONVEX_DEPLOYMENT
# - VITE_CONVEX_URL
# - VITE_CONVEX_SITE_URL
# - VITE_WORKER_URL
# - VITE_SITE_URL
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - VITE_AGENT_WORKER_SECRET
