name = "delphi-agent-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ed8b8023e8bf42f39daade39278c4a21"

# Default environment (production)
[vars]
ENVIRONMENT = "production"

# Secrets (add via wrangler secret put)
# CONVEX_DEPLOY_URL
# CLAUDE_API_KEY
# FIRECRAWL_API_KEY

# Durable Objects
# Track 7 v3.1: Single RoomOrchestratorDO for all room types
[[durable_objects.bindings]]
name = "ROOM_ORCHESTRATOR"
class_name = "RoomOrchestratorDO"

# Firecrawl request queue for managing concurrency (free plan: 2 concurrent)
[[durable_objects.bindings]]
name = "FIRECRAWL_QUEUE"
class_name = "FirecrawlQueueDO"

# Migration history (preserved for Cloudflare)
# v1: RoomOrchestratorDO and FirecrawlQueueDO (using SQLite for free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomOrchestratorDO", "FirecrawlQueueDO"]

# Development environment
[env.dev]
name = "delphi-agent-worker-dev"
[env.dev.vars]
ENVIRONMENT = "development"

# Staging environment
[env.staging]
name = "delphi-agent-worker-staging"
[env.staging.vars]
ENVIRONMENT = "staging"

# Local development settings
[dev]
port = 8787
local_protocol = "http"
